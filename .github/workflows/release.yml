name: release

# Tag-triggered npm publish with provenance. The heavier source-plane gate
# (typecheck/test/coverage/lint/build-drift/pack-smoke against the pinned
# harness checkout) already runs in ci.yml on the same tag push, so this
# workflow only re-runs the harness-independent artifact/README gates before
# publishing the committed lib/ with provenance.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Gate
        run: |
          pnpm run verify:self-contained
          pnpm run verify:artifacts
          pnpm run check:readmes

      - name: Verify the changelog names this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "## \[${VERSION}\]" CHANGELOG.md || { echo "CHANGELOG.md has no '## [${VERSION}]' section"; exit 1; }

      # Publish with provenance when NPM_TOKEN is present. A tag push without
      # the secret, or for a version already on the registry, skips instead of
      # failing the release tag.
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          # Do NOT read the token through setup-node's `${NODE_AUTH_TOKEN}`
          # expansion. The family's first release died that way with
          # `*** is not a legal HTTP header value`, AFTER the provenance
          # statement had been signed. The secret was measured to carry NO
          # CR/LF, so the trailing-newline hypothesis is disproven and the
          # mechanism is not established; what IS established is that the
          # env-expanded path failed and writing the userconfig directly
          # publishes. The same fix is in dsh-plugin-upgrade-015's workflow.
          raw_breaks="no"
          case "$NPM_TOKEN" in *$'\n'*|*$'\r'*) raw_breaks="yes" ;; esac
          token="$(printf '%s' "$NPM_TOKEN" | tr -d '\r\n')"
          echo "NPM_TOKEN secret contains line breaks: ${raw_breaks}"
          if [ -z "$token" ]; then
            echo "NPM_TOKEN secret is not set; skipping npm publish"
            exit 0
          fi
          if npm view "dsh-team-rooms@${version}" version >/dev/null 2>&1; then
            echo "dsh-team-rooms@${version} is already published; skipping npm publish"
          else
            printf '//registry.npmjs.org/:_authToken=%s\n' "$token" > "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
            npm publish --provenance --access public
          fi

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "release ${{ github.ref_name }} already exists; skipping"
            exit 0
          fi
          gh release create "${{ github.ref_name }}" --generate-notes
