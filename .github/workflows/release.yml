name: release

# Tag-triggered npm publish with provenance. The heavier source-plane gate
# (typecheck/test/coverage/lint/build-drift/pack-smoke against the pinned
# harness checkout) already runs in ci.yml on the same tag push, so this
# workflow only re-runs the harness-independent artifact/README gates before
# publishing the committed lib/ with provenance.
on:
  # workflow_dispatch is how a tag whose publish failed gets re-run after a fix:
  # a tag push executes the workflow file AT THE TAGGED COMMIT, so a fix committed
  # after the tag would never run under that tag. Dispatching on the branch runs
  # this file and checks out the fixed tree.
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # No `registry-url` on purpose: it writes
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into a local
          # .npmrc, and with the secret retired that line is an EMPTY bearer token -
          # the registry then answers 404 on PUT instead of letting npm perform the
          # OIDC trusted-publishing exchange.
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Gate
        run: |
          pnpm run verify:self-contained
          pnpm run verify:artifacts
          pnpm run check:readmes

      - name: Verify the changelog names this version
        run: |
          # A tag push names the version in the ref; a workflow_dispatch run on a
          # branch does not, so fall back to package.json there.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          grep -q "## \[${VERSION}\]" CHANGELOG.md || { echo "CHANGELOG.md has no '## [${VERSION}]' section"; exit 1; }

      # Trusted publishing: the OIDC token (id-token: write above) replaces the
      # long-lived NPM_TOKEN, so this step reads no secret. The previous version
      # also skipped the publish when NPM_TOKEN was empty - that guard is gone on
      # purpose, or retiring the secret would have turned this into a silent no-op.
      # The hand-written `.npmrc` line it used to write is gone with it: a
      # configured bearer token is preferred over the OIDC exchange, and the
      # registry then answers 404 on PUT instead of publishing.
      - name: Upgrade npm and show what the publish will authenticate with
        run: |
          npm install -g npm@^11.5.1
          echo "npm: $(npm --version)"
          echo "registry: $(npm config get registry)"
          if [ -f .npmrc ]; then echo "--- workspace .npmrc ---"; cat .npmrc; else echo "no workspace .npmrc"; fi
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then echo "OIDC request TOKEN: present"; else echo "OIDC request TOKEN: MISSING"; fi

      - name: Publish to npm
        env:
          # npm's OIDC exchange never throws: a failure is only visible at verbose
          # level, otherwise the step just fails with ENEEDAUTH and no reason.
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-team-rooms@${version}" version >/dev/null 2>&1; then
            echo "dsh-team-rooms@${version} is already published; skipping npm publish"
          else
            npm publish --provenance --access public
          fi

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag push releases the pushed tag; a workflow_dispatch run on a branch
          # releases the version in package.json (that tag already exists).
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            REF_NAME="${GITHUB_REF_NAME}"
          else
            REF_NAME="v$(node -p "require('./package.json').version")"
          fi
          if gh release view "${REF_NAME}" >/dev/null 2>&1; then
            echo "release ${REF_NAME} already exists; skipping"
            exit 0
          fi
          gh release create "${REF_NAME}" --generate-notes
